name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Clone pinned dnd4e system for verify scripts
        run: |
          set -euo pipefail
          REPO_URL=$(jq -r .dnd4eSystem.repository package.json)
          VERSION=$(jq -r .dnd4eSystem.version package.json)
          mkdir -p ../../systems
          git clone --depth 1 --branch "$VERSION" "$REPO_URL" ../../systems/dnd4e

      - run: npm ci
      - run: npm run check
